# SQL generation: structured (legacy), expanded, mixed (default).
PERF_QUERY_GENERATOR_MODE=mixed
# Shared workload for the MySQL/TiDB/CockroachDB/OceanBase throughput benchmark.
# Database endpoints, report roots, prefixes, and versions remain runner-specific.

DURATION_SECONDS=900
MAX_CAMPAIGN_DURATION_SECONDS=900
MAX_SEED_SECONDS=900
TIMEOUT_SECONDS=900
NUM_QUERIES=64
WORKERS=16
TRIES=1000
QUERY_TIMEOUT_SECONDS=5
STATEMENT_KIND_RETRIES=0

DATA_GENERATOR_MODE=model-v1
MIN_TABLES=2
MAX_TABLES=4
MIN_ROWS_PER_TABLE=100
MAX_ROWS_PER_TABLE=1000
MIN_COLUMNS=3
MAX_COLUMNS=6
MAX_INDEXES_PER_TABLE=4
SINGLE_COLUMN_MODEL_PROBABILITY=0.8
MULTI_COLUMN_MODEL_PROBABILITY=0.6
INTER_TABLE_MODEL_PROBABILITY=0.8
REPEAT_COUNT=5

PERF_INSERT_BATCH_SIZE=500
PERF_CONTINUE_AFTER_FORMAL_WITNESS=1
PERF_ASYNC_REPORT_WRITES=1
PERF_REPORT_QUEUE_CAPACITY=256
PERF_REPORT_QUEUE_OFFER_MS=50

PERF_COUNTERFACTUAL_HINT_PROBABILITY=0.5
PERF_PREDICATE_BINDING_PROBABILITY=0.5
PERF_QUERY_REWRITE_PROVIDER=wetune-static
PERF_WETUNE_STATIC_WORKER=tools/wetune-static-worker/build/install/wetune-static-worker/bin/wetune-static-worker
PERF_WETUNE_STATIC_TIMEOUT_MS=250
PERF_HINT_INCLUDE_TYPES=
PERF_HINT_EXCLUDE_TYPES=
PERF_HINT_FAMILY_QUOTA=8
PERF_HINT_FAMILY_WEIGHT_MODE=uniform
PERF_HINT_MAX_CANDIDATES_PER_FAMILY=8

COST_THRESHOLD=10.0
RUNTIME_THRESHOLD=10.0
PERF_TAXONOMY_ENABLE=1
PERF_TAXONOMY_MIN_RUNTIME_MEDIAN_MS=0.2
PERF_TAXONOMY_MIN_RUNTIME_ABS_GAP_MS=0.5
PERF_TAXONOMY_RUNTIME_RATIO_LOWER_BOUND=0.90
PERF_TAXONOMY_RUNTIME_RATIO_UPPER_BOUND=1.30
PERF_REPORT_HARMFUL_RUNTIME_RATIO=3.0
PERF_REPORT_COST_ANOMALY_RATIO=10.0
