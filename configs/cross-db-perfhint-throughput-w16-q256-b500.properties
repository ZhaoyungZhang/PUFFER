QPG_ENABLE=1
QPG_LOG_QUERY_PLAN=1
QPG_MAX_INTERVAL=1000
QPG_REWARD_WEIGHT=0.25
QPG_SELECTION_PROBABILITY=0.7
QPG_STALE_WINDOW_SIZE=60
QPG_STALE_WINDOW_MAX_NEW_PLANS=0
QPG_STALE_WINDOW_MAX_POOL_GROWTH=0
QPG_STALE_REWARD_LOOKBACK=60
QPG_STALE_MAX_RECENT_REWARD=.05

SUMMARY_INTERVAL_SECONDS=900
SUMMARY_NICE_LEVEL=19
SUMMARY_TELEMETRY_PER_SECOND=0
PERF_HINT_TELEMETRY_FLUSH_SECONDS=10
