# SQL generation: structured (legacy), expanded, mixed (default).
PERF_QUERY_GENERATOR_MODE=mixed
# MySQL 9.7.1 QPG/PERFORMANCE_HINT: one-week optimistic WeTune experiment.
# Load with:
#   scripts/run_mysql_9_7_1_sqlancer.sh --config configs/mysql-9.7.1-qpg-perfhint-optimistic.properties qpg-campaign
# All values may be overridden by explicitly exported environment variables.

# Campaign identity, duration, reproducibility, and connection target.
REPORT_ROOT=evaluation/mysql/mysql9_qpg_wetune_1w
CAMPAIGN_LOG_DIR=evaluation/mysql/mysql9_qpg_wetune_1w/campaign_logs
SQLANCER_LOG_DIR=evaluation/mysql/mysql9_qpg_wetune_1w/sqlancer_logs
DB_PREFIX_BASE=mysql971qpgwetune1w
DURATION_SECONDS=604800
MAX_CAMPAIGN_DURATION_SECONDS=604800
SEED=0
START_SEED=0
NUM_QUERIES=64
WORKERS=1
TIMEOUT_SECONDS=900
MAX_SEED_SECONDS=900
QUERY_TIMEOUT_SECONDS=5
STATEMENT_KIND_RETRIES=0
HOST=127.0.0.1
PORT=34971
USERNAME=sqlancer
PASSWORD=sqlancer
MYSQL_EXPECTED_VERSION_PREFIX=9.7.1

# Schema/data scale and runtime measurement policy.
DATA_GENERATOR_MODE=model-v1
MIN_TABLES=2
MAX_TABLES=4
MIN_ROWS_PER_TABLE=100
MAX_ROWS_PER_TABLE=1000
MIN_COLUMNS=3
MAX_COLUMNS=6
MAX_INDEXES_PER_TABLE=1
ENABLE_HISTOGRAM_REFRESH=1
MAX_HISTOGRAM_COLUMNS_PER_TABLE=2
SINGLE_COLUMN_MODEL_PROBABILITY=0.8
MULTI_COLUMN_MODEL_PROBABILITY=0.6
INTER_TABLE_MODEL_PROBABILITY=0.8
REPEAT_COUNT=5

# HINT/WeTune scheduling. This is the probability of selecting an entire HINT
# batch for a base Q; otherwise every available WeTune rewrite (up to 16) is
# measured. It is not a QPG threshold.
PERF_COUNTERFACTUAL_HINT_PROBABILITY=0.5
PERF_PREDICATE_BINDING_PROBABILITY=0.5
PERF_QUERY_REWRITE_PROVIDER=wetune-static
PERF_WETUNE_STATIC_WORKER=tools/wetune-static-worker/build/install/wetune-static-worker/bin/wetune-static-worker
# 250 ms prevents a valid persistent worker response from being mistaken for
# an empty rewrite batch on a temporarily busy host.
PERF_WETUNE_STATIC_TIMEOUT_MS=250
PERF_HINT_INCLUDE_TYPES=
PERF_HINT_EXCLUDE_TYPES=NO_BNL,BKA
PERF_HINT_FAMILY_QUOTA=8
PERF_HINT_FAMILY_WEIGHT_MODE=uniform
PERF_HINT_MAX_CANDIDATES_PER_FAMILY=8

# Legacy strict taxonomy thresholds are retained as diagnostic metadata. The
# optimistic nine-cell measurement pipeline does not use them as runtime gates.
COST_THRESHOLD=10.0
RUNTIME_THRESHOLD=10.0
PERF_TAXONOMY_ENABLE=1
# Weekly recommendation: avoid classifying sub-0.2 ms runs, require a 0.5 ms
# median gap, 30% runtime separation, and 10% cost separation. These values
# are shared by all A-I cells; the legacy A-D thresholds below are metadata.
PERF_TAXONOMY_MIN_RUNTIME_MEDIAN_MS=0.2
PERF_TAXONOMY_MIN_RUNTIME_ABS_GAP_MS=0.5
PERF_TAXONOMY_RUNTIME_RATIO_LOWER_BOUND=0.90
PERF_TAXONOMY_RUNTIME_RATIO_UPPER_BOUND=1.30
PERF_REPORT_HARMFUL_RUNTIME_RATIO=3.0
PERF_REPORT_COST_ANOMALY_RATIO=10.0
PERF_TAXONOMY_REPORT_CELLS=A,B,C,D,G
PERF_TAXONOMY_COST_RATIO_LOWER_BOUND=0.90
PERF_TAXONOMY_COST_RATIO_UPPER_BOUND=1.10

# QPG controls. The leading decimal below is intentional: .05 is
# QPG_STALE_MAX_RECENT_REWARD, never PERF_COUNTERFACTUAL_HINT_PROBABILITY.
QPG_ENABLE=1
QPG_LOG_QUERY_PLAN=1
QPG_MAX_INTERVAL=1000
QPG_REWARD_WEIGHT=0.25
QPG_SELECTION_PROBABILITY=0.7
QPG_STALE_WINDOW_SIZE=60
QPG_STALE_WINDOW_MAX_NEW_PLANS=0
QPG_STALE_WINDOW_MAX_POOL_GROWTH=0
QPG_STALE_REWARD_LOOKBACK=60
QPG_STALE_MAX_RECENT_REWARD=.05
# Live summaries are incremental, low-priority and aggregate-only. They do
# not rescan report trees or replay historic QPG/telemetry logs.
SUMMARY_INTERVAL_SECONDS=900
SUMMARY_NICE_LEVEL=19
SUMMARY_TELEMETRY_PER_SECOND=0
PERF_HINT_TELEMETRY_FLUSH_SECONDS=60
