plugins {
    id 'application'
}

group = 'com.sqlancer'
version = '1.0.0'

repositories {
    flatDir {
        dirs('../../third_party/wetune/lib')
    }
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation 'wtune:superopt:0.1'
    implementation 'wtune:common:0.1'
    implementation 'wtune:sql:0.1'
    implementation 'wtune:stmt:0.1'
    implementation 'wtune:spes:0.1'
    implementation(name: 'z3-4.8.9')
    implementation 'org.jetbrains:annotations:16.0.2'
    implementation 'com.google.guava:guava:31.0.1-jre'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'net.sf.trove4j:trove4j:3.0.3'
    implementation 'com.zaxxer:HikariCP:5.0.0'
    implementation 'org.antlr:antlr4-runtime:4.8-1'
    implementation 'org.xerial:sqlite-jdbc:3.32.3'
    implementation 'me.tongfei:progressbar:0.9.2'
    implementation 'mysql:mysql-connector-java:8.0.25'
    implementation 'org.postgresql:postgresql:42.3.1'
    implementation 'com.microsoft.sqlserver:mssql-jdbc:9.4.0.jre16'
    implementation 'org.apache.calcite:calcite-core:1.19.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

application {
    mainClass = 'sqlancer.wetune.worker.WeTuneStaticWorkerMain'
    applicationDefaultJvmArgs = ['-Xmx256m']
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('processResources') {
    from('../../third_party/wetune/wtune_data/prepared/rules.txt')
}
